<style>
:root{
  --bg:#08080c;
  --card:#12121a;
  --text:#f7f7fb;
  --muted:#a8a8b8;
  --line:#292936;
  --a:#8b5cf6;
  --b:#ec4899;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,Arial,sans-serif;
  line-height:1.6;
}

.wrap{
  width:min(900px,92%);
  margin:auto;
}

a{
  color:inherit;
  text-decoration:none;
}

nav{
  height:76px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line);
}

.logo{
  font-weight:900;
  letter-spacing:.04em;
}

.back{
  color:var(--muted);
}

main{
  padding:55px 0 80px;
}

.head{
  display:flex;
  justify-content:space-between;
  gap:30px;
  align-items:flex-start;
}

.eyebrow{
  color:#b9a7ff;
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:.75rem;
  font-weight:800;
}

.head h1{
  font-size:clamp(2.5rem,7vw,4.7rem);
  line-height:.95;
  letter-spacing:-.06em;
  margin:8px 0;
}

.grad{
  background:linear-gradient(100deg,var(--a),var(--b));
  -webkit-background-clip:text;
  color:transparent;
}

.role{
  font-size:1.15rem;
  color:#ddd;
}

.contact{
  text-align:right;
  color:var(--muted);
  font-size:.92rem;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:25px 0 45px;
}

.btn{
  display:inline-block;
  padding:11px 17px;
  border:1px solid var(--line);
  border-radius:10px;
  font-weight:750;
}

.primary{
  background:#fff;
  color:#111;
}

section{
  border-top:1px solid var(--line);
  padding:32px 0;
}

.title{
  font-size:1.15rem;
  text-transform:uppercase;
  letter-spacing:.12em;
  margin:0 0 16px;
}

.summary{
  color:#d1d1dc;
  font-size:1.02rem;
  max-width:760px;
}

.skills{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.skill{
  background:#171720;
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 11px;
  font-size:.82rem;
  color:#d0d0da;
}

.job{
  margin-bottom:28px;
}

.job:last-child{
  margin-bottom:0;
}

.job h3{
  margin:0;
  font-size:1.12rem;
}

.meta{
  color:#b9a7ff;
  font-size:.9rem;
  margin:2px 0 8px;
}

.job ul{
  margin:8px 0 0;
  padding-left:20px;
  color:#d0d0da;
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
}

footer{
  border-top:1px solid var(--line);
  padding:28px 0;
  color:var(--muted);
  font-size:.88rem;
}

@media(max-width:700px){
  .head,
  .two{
    display:block;
  }

  .contact{
    text-align:left;
    margin-top:20px;
  }

  .actions{
    margin-bottom:30px;
  }
}

@media print{
  body{
    background:#fff;
    color:#111;
  }

  .wrap{
    width:100%;
  }

  nav,
  .actions,
  footer{
    display:none;
  }

  .head h1,
  .title,
  .summary,
  .job h3,
  .job ul,
  .skill{
    color:#111;
  }

  .grad{
    color:#111;
    background:none;
  }

  .contact,
  .meta{
    color:#444;
  }

  .skill{
    border-color:#ccc;
    background:#fff;
  }

  section{
    border-color:#ddd;
  }
}
</style>
</head>
